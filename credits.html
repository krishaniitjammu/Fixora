<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo credits — Fixora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

<main>
  <section class="page-head">
    <div class="wrap">
      <div class="eyebrow">Credits</div>
      <h1 style="font-size:2.2rem">Photo credits</h1>
      <p>Appliance and spare-part photos come from Wikimedia Commons and are used under the free licence shown next to each one. Parts without a matching free photo show an appliance icon instead.</p>
    </div>
  </section>

  <section class="section" style="padding-top:28px">
    <div class="wrap">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Item</th><th>Photo</th><th>Author</th><th>Licence</th></tr></thead>
          <tbody id="creditRows"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script src="js/data.js?v=3"></script>
<script src="js/photos.js?v=3"></script>
<script src="js/app.js?v=3"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  function row(name, ph) {
    return '<tr><td><b>' + name + '</b></td><td><a class="link" href="' + esc(ph.page) + '" target="_blank" rel="noopener">' + esc(ph.title) + '</a></td><td>' + esc(ph.author) + '</td><td>' + esc(ph.license) + '</td></tr>';
  }
  $("#creditRows").innerHTML = APPLIANCES.filter(function (a) { return APPLIANCE_PHOTOS[a.id]; }).map(function (a) {
    return row(a.name, APPLIANCE_PHOTOS[a.id]);
  }).join("") + PARTS.filter(function (p) { return PART_PHOTOS[p.id]; }).map(function (p) {
    return row(p.name, PART_PHOTOS[p.id]);
  }).join("");
});
</script>
</body>
</html>
