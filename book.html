<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a technician — Fixora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main>
  <section class="page-head">
    <div class="wrap">
      <div class="eyebrow">Doorstep repair</div>
      <h1 style="font-size:2.2rem">Book a technician</h1>
      <p>Pick a time slot and a verified technician comes to you with the right part. You pay only after the appliance is working.</p>
    </div>
  </section>

  <section class="section" style="padding-top:28px">
    <div class="wrap split" id="bookWrap">
      <form id="bookForm" novalidate>
        <div class="form-block">
          <h3><i>1</i>What needs fixing?</h3>
          <div class="row-2">
            <div class="field"><label for="appSel">Appliance</label><select class="input" id="appSel"></select></div>
            <div class="field"><label for="issueSel">Problem</label><select class="input" id="issueSel"></select></div>
          </div>
          <p class="small muted">Not sure of the problem? <a class="link" href="diagnose.html">Ask an expert first</a>, it is free.</p>
        </div>

        <div class="form-block">
          <h3><i>2</i>When should we come?</h3>
          <div class="field"><label>Date</label><div class="pills" id="dates"></div></div>
          <div class="field" style="margin-bottom:0"><label>Time slot</label><div class="pills" id="slots"></div></div>
        </div>

        <div class="form-block">
          <h3><i>3</i>Where should we come?</h3>
          <div class="row-2">
            <div class="field"><label for="name">Your name</label><input class="input" id="name" autocomplete="name"></div>
            <div class="field"><label for="phone">Mobile number</label><input class="input" id="phone" inputmode="numeric" maxlength="10" placeholder="10-digit number" autocomplete="tel"></div>
          </div>
          <div class="field"><label for="address">Address</label><textarea class="input" id="address" style="min-height:80px" placeholder="House no., street, locality" autocomplete="street-address"></textarea></div>
          <div class="field" style="max-width:200px;margin-bottom:0"><label for="pin">PIN code</label><input class="input" id="pin" inputmode="numeric" maxlength="6" placeholder="180001"></div>
        </div>
      </form>

      <aside class="sticky">
        <div class="estimate" id="summary"></div>
      </aside>
    </div>

    <div class="wrap" id="history" style="margin-top:36px"></div>
  </section>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var app = getApp(param("appliance")) || APPLIANCES[0];
  var issueId = getIssue(app, param("issue")) ? param("issue") : "";
  var dates = [], date = 0, slot = null;

  var today = new Date();
  for (var d = 1; d <= 6; d++) {
    var day = new Date(today.getFullYear(), today.getMonth(), today.getDate() + d);
    dates.push({
      top: d === 1 ? "Tomorrow" : day.toLocaleDateString("en-IN", { weekday: "short" }),
      label: day.toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "short" }),
      short: day.toLocaleDateString("en-IN", { day: "numeric", month: "short" })
    });
  }

  function renderSelects() {
    $("#appSel").innerHTML = APPLIANCES.map(function (a) {
      return '<option value="' + a.id + '"' + (a.id === app.id ? " selected" : "") + ">" + a.name + "</option>";
    }).join("");
    $("#issueSel").innerHTML = '<option value="">Not sure, inspect and tell me</option>' + app.issues.map(function (i) {
      return '<option value="' + i.id + '"' + (i.id === issueId ? " selected" : "") + ">" + i.title + "</option>";
    }).join("");
  }

  function renderWhen() {
    $("#dates").innerHTML = dates.map(function (x, n) {
      return '<button type="button" class="pill' + (n === date ? " on" : "") + '" data-date="' + n + '">' + x.top + " · " + x.short + "</button>";
    }).join("");
    $("#slots").innerHTML = SLOTS.map(function (s) {
      return '<button type="button" class="pill' + (s === slot ? " on" : "") + '" data-slot="' + s + '">' + s + "</button>";
    }).join("");
  }

  function renderSummary() {
    var issue = getIssue(app, issueId), rows, note;
    if (issue) {
      var q = quote(issue);
      rows = q.parts.map(function (p) { return '<li><span>' + p.name + '</span><span>' + inr(p.price) + '</span></li>'; }).join("") +
        '<li><span>Service and fitting</span><span>' + (issue.labour ? inr(issue.labour) : "Free") + '</span></li>' +
        '<li><span>Inspection fee</span><span>Waived</span></li>' +
        '<li class="total"><span>Estimated total</span><span>' + inr(q.total) + '</span></li>' +
        '<li class="local"><span>Typical local shop</span><span>' + inr(q.local) + '</span></li>';
      note = '<span class="save-pill">You save about ' + inr(q.save) + '</span>';
    } else {
      rows = '<li><span>Inspection visit</span><span>' + inr(VISIT_FEE) + '</span></li>' +
        '<li class="total"><span>Pay on visit</span><span>' + inr(VISIT_FEE) + '</span></li>';
      note = '<p class="small muted">The technician finds the fault and gives you an itemised quote. The fee is waived if you go ahead.</p>';
    }
    $("#summary").innerHTML =
      '<div class="estimate-top"><span class="ico">' + icon(app) + '</span><div><b>' + app.name + '</b><div class="small muted">' + (issue ? issue.title : "Inspection visit") + '</div></div></div>' +
      '<ul class="rows" style="margin-top:8px">' + rows + '</ul>' + note +
      '<p class="small muted" style="margin:14px 0">' + dates[date].label + (slot ? " · " + slot : " · pick a time slot") + '</p>' +
      '<button class="btn block green" id="confirm">Confirm booking</button>' +
      '<p class="small muted" style="margin-top:10px;text-align:center">Pay after the job. Free cancellation up to 2 hours before.</p>';
  }

  function renderHistory() {
    var list = store("fixora_bookings") || [];
    if (!list.length) { $("#history").innerHTML = ""; return; }
    $("#history").innerHTML = '<h3 style="margin-bottom:14px">Your bookings on this device</h3><div class="table-wrap"><table><thead><tr><th>Booking</th><th>Repair</th><th>When</th><th class="num">Estimate</th></tr></thead><tbody>' +
      list.slice().reverse().map(function (b) {
        return '<tr><td><b>' + esc(b.id) + '</b></td><td>' + esc(b.appliance) + '<div class="small muted">' + esc(b.issue) + '</div></td><td>' + esc(b.when) + '</td><td class="num">' + inr(b.total) + '</td></tr>';
      }).join("") + '</tbody></table></div>';
  }

  function confirmBooking() {
    var name = $("#name").value.trim(), phone = $("#phone").value.trim(), address = $("#address").value.trim(), pin = $("#pin").value.trim();
    if (!slot) { toast("Pick a time slot"); return; }
    if (!name || !/^\d{10}$/.test(phone)) { toast("Enter your name and a 10-digit mobile number"); $("#name").focus(); return; }
    if (address.length < 8 || !/^\d{6}$/.test(pin)) { toast("Enter your address and a 6-digit PIN code"); $("#address").focus(); return; }

    var issue = getIssue(app, issueId);
    var booking = {
      id: "FX-" + Math.floor(100000 + Math.random() * 900000),
      appliance: app.name,
      issue: issue ? issue.title : "Inspection visit",
      when: dates[date].label + ", " + slot,
      total: issue ? quote(issue).total : VISIT_FEE
    };
    var list = store("fixora_bookings") || [];
    list.push(booking);
    store("fixora_bookings", list);

    $("#bookWrap").className = "wrap";
    $("#bookWrap").innerHTML = '<div class="success" style="max-width:680px"><h3>Booking confirmed</h3>' +
      '<p>Thanks, ' + esc(name) + '. Your booking <b>' + booking.id + '</b> is confirmed for <b>' + booking.when + '</b>.</p>' +
      '<ul class="rows" style="margin-top:12px"><li><span>' + booking.appliance + ' · ' + booking.issue + '</span><span><b>' + inr(booking.total) + '</b></span></li></ul>' +
      '<p class="small" style="margin-top:8px">Your technician\'s name and number are shared an hour before the visit, on the number ending ' + phone.slice(-4) + '. Prototype: no real technician is dispatched.</p>' +
      '<div class="hero-cta" style="margin-top:18px"><a class="btn" href="index.html">Back to home</a><a class="btn ghost" href="book.html">Book another repair</a></div></div>';
    renderHistory();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  $("#appSel").addEventListener("change", function () { app = getApp(this.value); issueId = ""; renderSelects(); renderSummary(); });
  $("#issueSel").addEventListener("change", function () { issueId = this.value; renderSummary(); });
  $("#bookForm").addEventListener("click", function (e) {
    var dt = e.target.closest("[data-date]"), sl = e.target.closest("[data-slot]");
    if (dt) date = Number(dt.getAttribute("data-date"));
    if (sl) slot = sl.getAttribute("data-slot");
    if (dt || sl) { renderWhen(); renderSummary(); }
  });
  $("#bookForm").addEventListener("submit", function (e) { e.preventDefault(); });
  $("#summary").addEventListener("click", function (e) { if (e.target.id === "confirm") confirmBooking(); });

  renderSelects(); renderWhen(); renderSummary(); renderHistory();
});
</script>
</body>
</html>
